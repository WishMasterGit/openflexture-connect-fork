include:
  - project: 'openflexure/ci-templates'
    file: '/javascript.yml'

# Feed parameters into the javascript job
.node_install:
  extends: .javascript
  variables:
    JS_IMAGE: electronuserland/builder:22-wine-mono
    JS_PATH: .
    JS_CACHE_PATH: node_modules
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - when: never

stages:
  - analysis
  - build
  - deploy

codespell:
  stage: analysis
  image: python:3.11-slim
  rules:
  - if: $CI_PIPELINE_SOURCE == "push"
  - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - pip install codespell
    - codespell

# JavaScript linting with ESLint (via Vue CLI)
eslint:
  extends: .node_install
  stage: analysis
  rules:
    # Add new rule first as the rules defined in .node_install
    # end in when: never, so if this new rule goes after that
    # clause, it will never be reached as rules are 
    # evaluated top to bottom
    - if: $CI_COMMIT_BRANCH
    # This syntax means we append the rules from the .node_install
    # job to this job, instead of overwriting them by creating
    # this new rules section
    - !reference [.node_install, rules]
  script:
    # Build JS application for production, erroring on any warnings
    - npm run lint -- --max-warnings=0

prettier:
  extends: .node_install
  stage: analysis
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - npm ci
    - npm run format:check

# Electron app build
build:
  extends: .node_install
  stage: build
  dependencies:
    - eslint

  script:
    # Build electron app (cannot build on MacOS in linux)
    - npm run build
    - npm run build:linux
    - npm run build:win

  artifacts:
    name: "dist"
    expire_in: 1 week
    paths:
      - "./dist/*.AppImage"
      - "./dist/*.snap"
      - "./dist/*.exe"
      - "./dist/*.appx"
      - "./dist/*.exe.blockmap"
      - "./dist/*.yml"
      - "./dist/*.yaml"
