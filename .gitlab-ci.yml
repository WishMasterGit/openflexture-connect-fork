include:
  - project: 'openflexure/ci-templates'
    file: '/javascript.yml'

# Feed parameters into the javascript job
.node_install:
  extends: .javascript
  variables:
    JS_IMAGE: electronuserland/builder:22-wine-mono
    JS_PATH: .
    JS_CACHE_PATH: node_modules

stages:
  - analysis
  - build
  - deploy

trigger_pipeline:
  stage: analysis

  script:
    - echo "Dummy job for merge-request"
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'

# JavaScript linting with ESLint (via Vue CLI)
eslint:
  extends: .node_install
  stage: analysis

  script:
    # Build JS application for production
    - npm run lint

# Electron app build
build:
  extends: .node_install
  stage: build
  dependencies:
    - eslint

  script:
    # Build electron app (cannot build on MacOS in linux)
    - npm run build
    - npm run build:linux
    - npm run build:win

  artifacts:
    name: "dist"
    expire_in: 1 week
    paths:
      - "./dist/*.AppImage"
      - "./dist/*.snap"
      - "./dist/*.exe"
      - "./dist/*.appx"
      - "./dist/*.exe.blockmap"
      - "./dist/*.yml"
      - "./dist/*.yaml"

# Deploy to builds.openflexure.org
deploy:
  stage: deploy
  dependencies:
    - build
  image: ubuntu:latest
  
  before_script:
    - 'which ssh-agent || ( apt-get update -y && apt-get install openssh-client -y )'
    - eval $(ssh-agent -s)
    - ssh-add <(echo "$SSH_PRIVATE_KEY_BATH_OPENFLEXURE_BASE64" | base64 --decode)
    - mkdir -p ~/.ssh
    - echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config
    
  script:
    # Install rsync if not already installed
    - 'which rsync || ( apt-get update -y && apt-get install rsync -y )'
    
    # Upload the builds folder to openflexure-microscope builds 
    - rsync -hrvz -e ssh dist/ ci-user@openflexure.bath.ac.uk:/var/www/build/openflexure-ev/
    
    # Run update-latest.py on the build server
    - ssh -t ci-user@openflexure.bath.ac.uk "/var/www/build/update-latest.py"
    
  rules:
    # Stable versions (e.g. no prerelease suffix)
    - if: '$CI_COMMIT_TAG =~ /^v(\d+\.)*\d+$/'
    # Allow force publish via web
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - when: never
